services:
  # Backend Service (Spring Boot)
  - type: web
    name: adarsh-awning-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: adarsh-awning-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # Frontend Service (React + Nginx)
  - type: web
    name: adarsh-awning-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    # Set BACKEND_URL in the Render dashboard after the backend service is live
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  - name: adarsh-awning-db
    plan: free
