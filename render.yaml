services:
  # Backend Service (Spring Boot)
  - type: web
    name: adarsh-awning-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # Frontend Service (React + Nginx)
  - type: web
    name: adarsh-awning-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    # Set BACKEND_URL in the Render dashboard after the backend service is live
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
