services:
  # Backend Service (Spring Boot)
  - type: web
    name: adarsh-awning-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: adarsh-awning-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: adarsh-awning-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: adarsh-awning-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: adarsh-awning-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: adarsh-awning-db
          property: password

  # Frontend Service (React + Nginx)
  - type: web
    name: adarsh-awning-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    # Set BACKEND_URL in the Render dashboard after the backend service is live
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

databases:
  - name: adarsh-awning-db
    plan: free
